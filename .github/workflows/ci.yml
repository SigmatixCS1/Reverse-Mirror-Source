name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify README and markdown files
        run: |
          test -f README.md
          find . -maxdepth 2 -name '*.md' | sort
